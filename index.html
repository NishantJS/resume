  <!-- JSON-LD Structured Data ────────────────────────────────────
       A @graph rather than a lone Person, so the site itself and the
       landing page are describable nodes that the Person can be tied
       to. Google reads jobTitle, worksFor and award off the Person for
       the knowledge panel; the WebSite node is what earns the site-name
       treatment in results. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://www.nishant.click/#website",
        "url": "https://www.nishant.click/",
        "name": "Nishant Chorge",
        "description": "Portfolio of Nishant Chorge — Senior Software Developer in Mumbai, India.",
        "inLanguage": "en-IN",
        "publisher": { "@id": "https://www.nishant.click/#person" }
      },
      {
        "@type": "ProfilePage",
        "@id": "https://www.nishant.click/#webpage",
        "url": "https://www.nishant.click/",
        "name": "Nishant Chorge — Senior Software Developer",
        "isPartOf": { "@id": "https://www.nishant.click/#website" },
        "about": { "@id": "https://www.nishant.click/#person" },
        "primaryImageOfPage": "https://www.nishant.click/og-image.png",
        "inLanguage": "en-IN"
      },
      {
        "@type": "Person",
        "@id": "https://www.nishant.click/#person",
        "name": "Nishant Chorge",
        "alternateName": "Nishant",
        "nationality": "Indian",

        "telephone": "+916283925737",
        "image": "https://www.nishant.click/og-image.png",
        "gender": "Male",
        "birthDate": "2000-03-21",
        "birthPlace": {

          "address": {

            "addressLocality": "Karad",

            "addressCountry": "IN"
          }
        },
        "sameAs": [
          "https://www.linkedin.com/in/nishant-chorge/",
          "https://github.com/NishantJS"
        ],
        "jobTitle": "Senior Software Developer",
        "disambiguatingDescription": "Senior Software Developer specialising in Node.js, React, Next.js, Fastify, Redis, and micro-frontend architecture. 4+ years of experience building production-grade fintech and enterprise systems in Mumbai.",
        "description": "Senior Software Developer with 4+ years of experience building production-grade fintech and enterprise systems. Specialised in Node.js, React, Next.js, Fastify, Redis, and micro-frontend architecture.",
